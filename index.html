<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Leaflet JS</title>


    <!-- Leaflet CSS -->
    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


    <!-- Style Peta -->
    <style>

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        #map {
            width: 100%;
            height: 100%;
        }

    </style>

</head>


<body>


    <!-- Wadah Peta -->
    <div id="map"></div>


    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>


    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


    <script>


        // =====================================================
        // 1. INISIALISASI PETA
        // =====================================================

        var map = L.map("map").setView(
            [-8.2848467, 123.1649780],
            9
        );


        // =====================================================
        // 2. BASEMAP OPENSTREETMAP
        // =====================================================

        var basemap = L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }
        );


        // Menambahkan basemap ke peta
        basemap.addTo(map);



        // =====================================================
        // 3. GEOJSON POINT - TOPONIMI
        // =====================================================

        var toponimi = L.geoJSON(null, {


            // Mengatur simbol titik
            pointToLayer: function (feature, latlng) {

                return L.marker(latlng, {

                    icon: L.icon({

                        iconUrl: "images/home_marker.png",

                        iconSize: [48, 48],

                        iconAnchor: [24, 48],

                        popupAnchor: [0, -48],

                        tooltipAnchor: [-16, -30]

                    })

                });

            },


            // Mengatur popup dan tooltip
            onEachFeature: function (feature, layer) {


                // Isi popup
                var popup_content =
                    "Nama: " +
                    feature.properties.TOPONIMI +
                    "<br>" +

                    "Koordinat: " +
                    feature.geometry.coordinates[1] +
                    ", " +
                    feature.geometry.coordinates[0] +
                    "<br>" +

                    "<img src='images/" +
                    feature.properties.image +
                    "' width='200'>";


                // Popup
                layer.on({

                    click: function () {

                        layer
                            .bindPopup(popup_content)
                            .openPopup();

                    },


                    // Tooltip
                    mouseover: function () {

                        layer
                            .bindTooltip(
                                feature.properties.TOPONIMI,
                                {
                                    direction: "left",
                                    sticky: true
                                }
                            )
                            .openTooltip();

                    }

                });

            }

        });


        // Memanggil file GeoJSON Toponimi
        $.getJSON(
            "GEOJSON/toponimi.geojson",
            function (data) {

                toponimi.addData(data);

                map.addLayer(toponimi);

            }
        );



        // =====================================================
        // 4. GEOJSON POLYLINE - JALAN
        // =====================================================

        var jalan = L.geoJSON(null, {


            // Mengatur simbologi jalan
            style: function (feature) {

                return {

                    color: "red",

                    opacity: 1,

                    weight: 3

                };

            },


            // Mengatur popup dan tooltip
            onEachFeature: function (feature, layer) {


                // Isi popup jalan
                var popup_content =
                    "Fungsi: " +
                    feature.properties.NAMA_UNSUR +
                    "<br>" +

                    "Panjang (km): " +
                    feature.properties.panjang_km;


                layer.on({

                    // Popup jalan
                    click: function () {

                        layer
                            .bindPopup(popup_content)
                            .openPopup();

                    },


                    // Tooltip jalan
                    mouseover: function () {

                        layer
                            .bindTooltip(
                                feature.properties.NAMA_UNSUR,
                                {
                                    direction: "auto",
                                    sticky: true
                                }
                            )
                            .openTooltip();

                    }

                });

            }

        });


        // Memanggil file GeoJSON Jalan
        $.getJSON(
            "GEOJSON/jalan.geojson",
            function (data) {

                jalan.addData(data);

                map.addLayer(jalan);

            }
        );



        // =====================================================
        // 5. GEOJSON POLYGON - JUMLAH PENDUDUK
        // =====================================================

        var jumlah_penduduk = L.geoJSON(null, {


            // Mengatur simbologi berdasarkan jumlah penduduk
            style: function (feature) {


                // Mengambil nilai jumlah penduduk
                var penduduk =
                    Number(feature.properties.Penduduk);


                // Kelas 1
                if (penduduk <= 12000) {

                    return {

                        opacity: 1,

                        color: "black",

                        weight: 1,

                        fillOpacity: 0.7,

                        fillColor: "#ffffb2"

                    };

                }


                // Kelas 2
                else if (penduduk <= 24000) {

                    return {

                        opacity: 1,

                        color: "black",

                        weight: 1,

                        fillOpacity: 0.7,

                        fillColor: "#fd8d3c"

                    };

                }


                // Kelas 3
                else {

                    return {

                        opacity: 1,

                        color: "black",

                        weight: 1,

                        fillOpacity: 0.7,

                        fillColor: "#bd0026"

                    };

                }

            },


            // Mengatur popup dan tooltip
            onEachFeature: function (feature, layer) {


                // Isi popup
                var popup_content =
                    "Kecamatan: " +
                    feature.properties.NAMOBJ +
                    "<br>" +

                    "Jumlah Penduduk: " +
                    feature.properties.Penduduk;


                layer.on({

                    // Popup jumlah penduduk
                    click: function () {

                        layer
                            .bindPopup(popup_content)
                            .openPopup();

                    },


                    // Tooltip kecamatan
                    mouseover: function () {

                        layer
                            .bindTooltip(
                                feature.properties.NAMOBJ,
                                {
                                    direction: "auto",
                                    sticky: true
                                }
                            )
                            .openTooltip();

                    }

                });

            }

        });


        // Memanggil file GeoJSON Jumlah Penduduk
        $.getJSON(
            "GEOJSON/jumlah_penduduk.geojson",
            function (data) {

                jumlah_penduduk.addData(data);

                map.addLayer(jumlah_penduduk);

            }
        );



        // =====================================================
        // 6. CONTROL LAYER
        // =====================================================


        // Basemap
        var baseMaps = {

            "OpenStreetMap": basemap

        };


        // Overlay
        var overlayMaps = {

            "Toponimi": toponimi,

            "Jalan": jalan,

            "Jumlah Penduduk": jumlah_penduduk

        };


        // Membuat control layer
        var controllayer =
            L.control.layers(
                baseMaps,
                overlayMaps
            );


        // Menambahkan control layer ke peta
        controllayer.addTo(map);


    </script>


</body>

</html>
