<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Leaflet JS</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>

</head>

<body>

    <!-- Wadah Peta -->
    <div id="map"></div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>

        // =====================================================
        // INISIALISASI PETA
        // =====================================================

        var map = L.map("map").setView(
            [-8.2848467, 123.1649780],
            9
        );


        // =====================================================
        // BASEMAP OPENSTREETMAP
        // =====================================================

        var basemap = L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }
        );

        basemap.addTo(map);


        // =====================================================
        // GEOJSON POINT - TOPONIMI
        // =====================================================

        var toponimi = L.geoJSON(null, {

            // Simbologi titik
            pointToLayer: function (feature, latlng) {

                return L.marker(latlng, {

                    icon: L.icon({
                        iconUrl: "images/home_marker.png",
                        iconSize: [48, 48],
                        iconAnchor: [24, 48],
                        popupAnchor: [0, -48],
                        tooltipAnchor: [-16, -30]
                    })

                });

            },


            // Popup dan Tooltip
            onEachFeature: function (feature, layer) {

                var popup_content =
                    "Nama: " +
                    feature.properties.TOPONIMI +
                    "<br>" +

                    "Koordinat: " +
                    feature.geometry.coordinates[1] +
                    ", " +
                    feature.geometry.coordinates[0] +
                    "<br>" +

                    "<img src='images/" +
                    feature.properties.image +
                    "' alt='' width='200'>";


                layer.on({

                    // Popup
                    click: function () {

                        layer.bindPopup(
                            popup_content
                        ).openPopup();

                    },


                    // Tooltip
                    mouseover: function () {

                        layer.bindTooltip(
                            feature.properties.TOPONIMI,
                            {
                                direction: "left",
                                sticky: true
                            }
                        ).openTooltip();

                    }

                });

            }

        });


        // Memanggil GeoJSON Toponimi
        $.getJSON(
            "GEOJSON/toponimi.geojson",
            function (data) {

                toponimi.addData(data);

                map.addLayer(toponimi);

            }
        );


        // =====================================================
        // GEOJSON POLYLINE - JALAN
        // =====================================================

        var jalan = L.geoJSON(null, {

            // Simbologi jalan
            style: function () {

                return {
                    color: "red",
                    opacity: 1,
                    weight: 3
                };

            },


            // Popup dan Tooltip
            onEachFeature: function (feature, layer) {

                var popup_content =
                    "Fungsi: " +
                    feature.properties.NAMA_UNSUR +
                    "<br>" +

                    "Panjang (km): " +
                    feature.properties.panjang_km;


                layer.on({

                    // Popup
                    click: function () {

                        layer.bindPopup(
                            popup_content
                        ).openPopup();

                    },


                    // Tooltip
                    mouseover: function () {

                        layer.bindTooltip(
                            feature.properties.NAMA_UNSUR,
                            {
                                direction: "auto",
                                sticky: true
                            }
                        ).openTooltip();

                    }

                });

            }

        });


        // Memanggil GeoJSON Jalan
        $.getJSON(
            "GEOJSON/jalan.geojson",
            function (data) {

                jalan.addData(data);

                map.addLayer(jalan);

            }
        );


        // =====================================================
        // GEOJSON POLYGON - JUMLAH PENDUDUK
        // =====================================================

        var jumlah_penduduk = L.geoJSON(null, {

            // Simbologi berdasarkan jumlah penduduk
            style: function (feature) {

                var penduduk =
                    parseFloat(
                        feature.properties.Penduduk
                    );


                // Penduduk <= 12.000
                if (penduduk <= 12000) {

                    return {
                        opacity: 1,
                        color: "black",
                        weight: 1,
                        fillOpacity: 0.7,
                        fillColor: "#ffffb2"
                    };

                }


                // Penduduk 12.001 - 24.000
                else if (
                    penduduk > 12000 &&
                    penduduk <= 24000
                ) {

                    return {
                        opacity: 1,
                        color: "black",
                        weight: 1,
                        fillOpacity: 0.7,
                        fillColor: "#fd8d3c"
                    };

                }


                // Penduduk > 24.000
                else {

                    return {
                        opacity: 1,
                        color: "black",
                        weight: 1,
                        fillOpacity: 0.7,
                        fillColor: "#bd0026"
                    };

                }

            },


            // Popup dan Tooltip
            onEachFeature: function (feature, layer) {

                var popup_content =
                    "Kecamatan: " +
                    feature.properties.WADMKC +
                    "<br>" +

                    "Jumlah Penduduk: " +
                    feature.properties.Penduduk;


                // Popup
                layer.bindPopup(
                    popup_content
                );


                // Tooltip
                layer.bindTooltip(
                    "Jumlah Penduduk: " + feature.properties.Penduduk,
                    {
                        direction: "auto",
                        sticky: true
                    }
                );

            }

        });


        // =====================================================
        // MEMANGGIL GEOJSON JUMLAH PENDUDUK
        // =====================================================

        $.getJSON(
            "GEOJSON/jumlah_penduduk.geojson",

            function (data) {

                jumlah_penduduk.addData(data);

                map.addLayer(jumlah_penduduk);

            }

        );


        // =====================================================
        // CONTROL LAYER
        // =====================================================

        var baseMaps = {

            "OpenStreetMap": basemap

        };


        var overlayMaps = {

            "Toponimi": toponimi,

            "Jalan": jalan,

            "Jumlah Penduduk": jumlah_penduduk

        };


        var controlLayer =
            L.control.layers(
                baseMaps,
                overlayMaps
            );


        controlLayer.addTo(map);

    </script>

</body>

</html>
